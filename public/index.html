<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRS · Ombor boshqaruv tizimi</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/warehouse.css">
<link rel="stylesheet" href="/css/plan.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%231f4e79'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Arial' font-weight='bold' fill='white'>O</text></svg>">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="login-screen">
  <div class="login-box">
    <div class="login-head">
      <div class="logo">CRS</div>
      <div class="sub" id="loginSub">Ombor boshqaruv tizimi</div>
    </div>
    <form class="login-body" id="loginForm" autocomplete="off">
      <div class="field">
        <label for="lgLogin" id="lblLogin">Login</label>
        <input id="lgLogin" type="text" value="" autocomplete="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="lgPass" id="lblPass">Parol</label>
        <input id="lgPass" type="password" value="" autocomplete="new-password" spellcheck="false" required>
      </div>
      <div id="loginErr"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:9px" type="submit" id="btnLogin">
        Tizimga kiritish
      </button>
      <div class="login-hint" id="loginHint">O‘zbekcha / Русский</div>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">CRS <small id="brandSub">Ombor boshqaruv tizimi</small></div>
    <div class="spacer"></div>
    <select id="whFilter" class="wh-select" title="Ombor"></select>
    <button class="lang-btn" id="langBtn" title="O‘zbekcha / Русский">RU</button>
    <div class="user-chip" id="userChip"></div>
    <button class="lang-btn" id="logoutBtn">Chiqish</button>
  </header>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="content" id="content"></main>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
